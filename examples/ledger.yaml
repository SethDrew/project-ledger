entries:
  - id: derivatives-over-absolutes
    date: 2026-01-15
    touched: 2026-02-10
    title: Rate-of-change matters more than absolute values
    summary: >
      Build vs climax has identical static features (RMS ±0.5%) but climax
      brightens 58x faster. The derivative is the signal, not position.
    status: validated
    warmth: high
    confidence: high
    source: research/analysis/taste/build_vs_climax.md
    tags: [feature-extraction, derivatives, brightness]
    relates_to: [build-taxonomy]
    notes: >
      First major insight. Changed thinking about all feature extraction.
      Validated on fa_br_drop1.wav. Needs testing on more songs.

  - id: feelings-are-contextual
    date: 2026-01-18
    touched: 2026-02-27
    title: "Feelings are contextual — deviation from local norm, not absolute thresholds"
    summary: >
      Subjective musical qualities emerge from deviation from the surrounding
      context, not from absolute acoustic properties. Use deviation-from-running-
      average, not fixed thresholds.
    status: validated
    warmth: high
    confidence: high
    source: research/analysis/taste/air_feature_analysis.md
    tags: [feature-extraction, context, feelings, perception]
    relates_to: [feeling-layer-human-loop, perception-is-layered-by-timescale]
    notes: >
      Feelings are relative to context, not absolute acoustic properties.
      A synth pad feels "open" after a dense section but "flat" after silence.
      The principle generalizes to all subjective qualities — they're
      comparisons, not measurements.

  - id: timbral-shift-detection-eagerness
    date: 2026-03-21
    touched: 2026-03-21
    title: "Timbral shift detection: simple algorithm + eagerness curve wins over complex approaches"
    summary: >
      Tested 5 approaches for deciding when to switch palettes based on
      timbral changes. The simplest one won: track recent timbre with a 5s
      average, fire when the current sound is unusually different, and get
      progressively more willing to switch as time passes (cubic eagerness
      curve, 3-sigma → 1-sigma over 2 minutes). The eagerness models the
      idea that humans get visually bored after 1-2 minutes of the same
      palette and want the vibe to change — even on a subtle moment.
    status: validated
    warmth: high
    confidence: high
    source: [audio-reactive/effects/timbral_section_detect.py, audio-reactive/viewer/viewer.py]
    tags: [effects, perception, timbral, section-detection, eagerness, architecture]
    relates_to: [perception-is-layered-by-timescale, ld-vj-decision-decomposition, normalization-events-separation, ema-time-constant-is-section-relative]
    notes: >
      Why we tested 5 approaches: the original detector (fixed threshold +
      15s cooldown) only caught changes with big energy swings (EDM drops)
      and missed subtle timbral shifts in hip-hop, dark electronic, and
      ambient. We built increasingly complex solutions trying to fix this.

      What we tried and why we rejected each:

      1. Anchored-reference dual-EMA with distance normalization — tuned
         across 675+ parameter combos, hit 4/6 tracks but required
         genre-specific parameters. Overfit.

      2. Dual-EMA (fast 5s + slow 45s) — gave the detector a longer
         memory of what the old section sounded like, but added
         complexity for marginal gain.

      3. L2-normalized MFCCs (strip loudness, keep shape only) —
         principled idea but loudness IS a real timbral feature that
         humans perceive. Removing it lost real boundaries.

      4. Adaptive codebook (learn a vocabulary of timbral states, fire
         when something new appears) — clever but overfit to codebook
         parameters.

      5. Core+candidate buckets (3 known states + 3 testing slots, fire
         when 2+ new states appear) — interesting but also overfit.

      The winning insight: this detector's job is to pick good MOMENTS
      to switch the visual — artistically choosing individual audio
      moments, rather than trying to identify section boundaries. The
      eagerness curve naturally handles the "when" by getting more
      willing over time. Right after a switch, only dramatic changes
      trigger (the new palette is fresh). After 2 minutes, even subtle
      shifts are enough (the palette is stale).

      This is complementary to section-level analysis. Section energy/
      mood should drive WHAT palette to show. This detector drives WHEN
      to switch. Different concerns, different timescales.

      Future: this same eagerness pattern could drive other transitions
      — effect selection, intensity modes, any parameter that should
      change "when the vibe shifts" but hold steady otherwise. Cheap
      to compute (13 floats + distance stats, streaming/causal).

  - id: rgb-color-gamut-limitations
    date: 2026-03-02
    touched: 2026-03-06
    title: "RGB LED color gamut is physically constrained — but fixable in layers"
    summary: >
      RGB LED strips have two stacked color problems: (1) no gamma correction
      means linear PWM vs nonlinear perception — orange looks yellow, warm tones
      are wrong; (2) 8-bit depth crushes low-brightness resolution after gamma
      correction (~28 values map to 0). Four complementary fixes exist, each
      adding a layer of quality.
    status: validated
    warmth: high
    confidence: high
    source: []
    tags: [hardware, perception, color, future]
    relates_to: [gamma-height-curve, hue-shift-low-brightness, hybrid-gamma-brightness]
    notes: >
      ## The problem stack
      1. **Gamma correction missing**: LED driver ICs use linear PWM but eyes
         perceive brightness logarithmically. Monitors/OS handle this transparently;
         LED strips don't. A gamma LUT (exponent ~2.5-2.7) fixes most color mixing
         issues. Per-channel R/G/B tables can further tune white balance.
      2. **8-bit quantization at low brightness**: After gamma correction, the
         first ~28 input values all map to 0 output. Pastels and subtle warm tones
         get destroyed. This is intrinsic to 8-bit PWM.

      ## Solution layers (cumulative, in order of effort)
      1. **Gamma LUT (software, free)**: Apply per-channel gamma correction before
         sending to strip. Step one regardless of anything else.
      2. **RGBW strips (hardware swap)**: Dedicated white channel adds a fourth
         mixing dimension — helps enormously with pastels, skin tones, amber.
      3. **Temporal dithering**: Delta-sigma modulation — rapidly wiggle each pixel
         ±1 at ~400Hz to achieve effective 16-bit resolution for fades. Especially
         powerful for low-brightness colors and smooth gradients.
      4. **Physical diffusion**: Spatially averages adjacent pixels = free spatial
         dithering. Combined with temporal dithering, larger/diffuse sculptures get
         even higher low-brightness precision.

      ## Key insight
      We're not capped out on color quality. The likely state is: sending linear RGB
      values to LEDs that need gamma-corrected values, using RGB strips where RGBW
      would give richer mixing. These are corrections monitors have had for decades —
      LED strips just leave them up to you.
